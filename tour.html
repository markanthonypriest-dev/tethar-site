<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tethar · Interactive Product Tour</title>
<!-- Embedded on the homepage; keep it out of search so it doesn't compete as thin duplicate content. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.tethar.com/">
<meta name="theme-color" content="#6A1B87">
<link rel="stylesheet" href="assets/css/fonts.css?v=1">
<style>
:root{
  --purple:#6A1B87; --teal:#1FB6B6; --teal-deep:#15807F; --violet:#A83DC4;
  --night:#130A1F; --plum:#2A1240; --paper:#F7F4FB; --soft:#7FD0CB;
  --ink:#241531; --muted:#6E6088;
  --disp:'Baloo 2',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); color:var(--ink); min-height:100vh;
  background:
    radial-gradient(1200px 700px at 12% -8%, rgba(31,182,182,.20), transparent 60%),
    radial-gradient(1000px 640px at 96% 108%, rgba(106,27,135,.18), transparent 60%),
    linear-gradient(160deg,#FBF9FE 0%, #F1F7F6 100%);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1160px;margin:0 auto;padding:22px 20px 40px;min-height:100vh;display:flex;flex-direction:column}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{display:flex;align-items:flex-end;gap:5px;line-height:1}
.hdrlogo{height:48px;width:auto;display:block}
.wordmark{font-family:var(--disp);font-weight:800;font-size:30px;color:var(--purple);letter-spacing:.2px}
.dots{display:flex;align-items:flex-end;gap:5px;padding-bottom:6px}
.dots i{display:block;border-radius:50%;background:var(--teal)}
.dots i:nth-child(1){width:12px;height:12px;opacity:1}
.dots i:nth-child(2){width:9px;height:9px;opacity:.8}
.dots i:nth-child(3){width:6px;height:6px;opacity:.6}
.tagline{font-family:var(--disp);font-weight:600;color:var(--teal-deep);font-size:12.5px;letter-spacing:.4px;margin-top:2px}
.top-right{display:flex;align-items:center;gap:10px}
.pill{font-family:var(--disp);font-weight:600;font-size:12px;color:var(--teal-deep);background:rgba(31,182,182,.12);
  border:1px solid rgba(31,182,182,.28);padding:7px 13px;border-radius:999px}
.jump{font-family:var(--disp);font-weight:700;font-size:13.5px;color:#fff;cursor:pointer;border:none;
  background:linear-gradient(135deg,var(--teal),var(--teal-deep));padding:10px 16px;border-radius:999px;
  box-shadow:0 6px 16px rgba(21,128,127,.30);transition:transform .15s, box-shadow .15s}
.jump:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(21,128,127,.38)}

/* stage */
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:min(6vw,64px);margin-top:14px;flex-wrap:wrap}

/* phone */
.phone{
  position:relative;width:min(330px,80vw);aspect-ratio:1080/2340;flex:0 0 auto;
  background:linear-gradient(160deg,#1a1420,#0c0910);border-radius:46px;padding:11px;
  box-shadow:0 2px 4px rgba(0,0,0,.5) inset, 0 30px 60px -18px rgba(30,10,50,.55), 0 8px 22px rgba(30,10,50,.20);
}
.phone::after{content:"";position:absolute;top:26%;right:-3px;width:3px;height:74px;border-radius:3px;
  background:linear-gradient(#2a2330,#0c0910)}
.phone::before{content:"";position:absolute;top:15%;left:-3px;width:3px;height:46px;border-radius:3px;
  background:linear-gradient(#2a2330,#0c0910)}
.screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#fff}
#shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* spotlight */
.veil{position:absolute;inset:0;pointer-events:none;transition:opacity .35s;z-index:5}
.spot{position:absolute;border-radius:16px;transition:all .5s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 0 3px rgba(31,182,182,.95), 0 0 0 9999px rgba(19,10,31,.52);z-index:6;pointer-events:none}
.spot.pulse{animation:ring 2s ease-out infinite}
@keyframes ring{
  0%{box-shadow:0 0 0 3px rgba(31,182,182,.95), 0 0 0 0 rgba(31,182,182,.5), 0 0 0 9999px rgba(19,10,31,.52)}
  70%{box-shadow:0 0 0 3px rgba(31,182,182,.95), 0 0 0 16px rgba(31,182,182,0), 0 0 0 9999px rgba(19,10,31,.52)}
  100%{box-shadow:0 0 0 3px rgba(31,182,182,.95), 0 0 0 0 rgba(31,182,182,0), 0 0 0 9999px rgba(19,10,31,.52)}
}
.tapnext{position:absolute;inset:0;z-index:7;cursor:pointer}

/* cover / end scenes */
.scene-fill{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:34px 26px;color:#fff;
  background:radial-gradient(120% 90% at 30% 12%, #2FC7C0 0%, var(--teal) 34%, var(--purple) 100%)}
.scene-fill.cover-light{background:radial-gradient(125% 80% at 50% 22%, #FFFFFF 0%, var(--paper) 62%, #ECE6F5 100%);color:var(--ink)}
.coverlogo{width:80%;max-width:288px;height:auto;filter:drop-shadow(0 10px 24px rgba(42,18,64,.10))}
.scene-fill .lockup{display:flex;align-items:flex-end;gap:6px;margin-bottom:6px}
.scene-fill .lockup .w{font-family:var(--disp);font-weight:800;font-size:40px;color:#fff}
.scene-fill .lockup .d{display:flex;align-items:flex-end;gap:5px;padding-bottom:9px}
.scene-fill .lockup .d i{display:block;border-radius:50%;background:#fff}
.scene-fill .lockup .d i:nth-child(1){width:13px;height:13px}
.scene-fill .lockup .d i:nth-child(2){width:10px;height:10px;opacity:.85}
.scene-fill .lockup .d i:nth-child(3){width:7px;height:7px;opacity:.7}
.scene-fill .thread{width:150px;height:12px;margin:-2px 0 8px;opacity:.9}
.scene-fill .tag{font-family:var(--disp);font-weight:600;letter-spacing:.5px;opacity:.95;font-size:15px}
.scene-fill .voice{margin-top:22px;max-width:250px;font-family:var(--body);font-style:italic;font-size:14px;
  line-height:1.55;opacity:.96;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);
  border-radius:16px;padding:14px 16px}
.scene-fill .voice .sig{display:block;font-style:normal;font-family:var(--disp);font-weight:700;margin-top:8px;opacity:.9;font-size:12.5px}
.scene-fill .kick{margin-top:24px;font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:1.6px;
  text-transform:uppercase;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);
  padding:8px 15px;border-radius:999px}
.scene-fill .big{font-family:var(--disp);font-weight:800;font-size:26px;margin:16px 0 8px;line-height:1.15}
.scene-fill .sub{font-size:14.5px;line-height:1.5;opacity:.95;max-width:250px}
.scene-fill .line{width:70px;height:3px;border-radius:3px;background:rgba(255,255,255,.6);margin:20px 0 4px}

/* panel */
.panel{width:min(400px,92vw);flex:0 1 400px}
.card{background:#fff;border:1px solid #EEE7F5;border-radius:26px;padding:26px 26px 22px;
  box-shadow:0 20px 50px -26px rgba(42,18,64,.32);
  /* Fixed column: the body text absorbs each step's length difference so the
     Back/Next buttons never move between steps. */
  display:flex;flex-direction:column;min-height:var(--card-min,470px)}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:700;font-size:11.5px;
  letter-spacing:1.4px;text-transform:uppercase;color:var(--teal-deep);background:rgba(31,182,182,.10);
  padding:6px 12px;border-radius:999px;margin-bottom:14px;align-self:flex-start}
.eyebrow b{width:7px;height:7px;border-radius:50%;background:var(--teal)}
h2.title{font-family:var(--disp);font-weight:800;color:var(--purple);font-size:25px;line-height:1.15;margin:0 0 10px}
p.body{font-size:15.5px;line-height:1.62;color:#3a2c48;margin:0;flex:1 1 auto}
p.body b{color:var(--purple);font-weight:700}
.progress{margin-top:22px}
.pcount{display:flex;justify-content:space-between;align-items:center;font-family:var(--disp);font-weight:600;
  font-size:12.5px;color:var(--muted);margin-bottom:8px}
.bar{height:6px;border-radius:999px;background:#EEE7F5;overflow:hidden}
.bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--purple));
  transition:width .45s cubic-bezier(.4,0,.2,1)}
.controls{display:flex;gap:11px;margin-top:20px}
.btn{flex:1;font-family:var(--disp);font-weight:700;font-size:15px;padding:13px 16px;border-radius:15px;cursor:pointer;
  border:none;transition:transform .14s, box-shadow .14s, opacity .14s}
.btn.ghost{background:#F4EEFA;color:var(--purple)}
.btn.ghost:hover{background:#EDE4F6}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--teal) 0%,var(--purple) 120%);
  box-shadow:0 8px 20px -6px rgba(106,27,135,.5)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px -6px rgba(106,27,135,.55)}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.subrow{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.restart{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px}
.restart:hover{color:var(--purple)}
.hint{font-family:var(--body);font-size:12px;color:#a99ec0}

/* dots nav */
.dotnav{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;justify-content:center}
.dotnav i{width:8px;height:8px;border-radius:50%;background:#DFD5EC;cursor:pointer;transition:all .2s}
.dotnav i.on{background:var(--purple);transform:scale(1.25)}
.dotnav i.chap{background:var(--soft)}

/* footer */
.foot{text-align:center;margin-top:26px;font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.6px;color:#a99ec0}

/* jump modal */
.modal{position:fixed;inset:0;background:rgba(19,10,31,.55);backdrop-filter:blur(4px);display:none;
  align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:24px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:26px}
.sheet h3{font-family:var(--disp);font-weight:800;color:var(--purple);font-size:20px;margin:0 0 4px}
.sheet .sub{font-size:13.5px;color:var(--muted);margin:0 0 16px}
.chapgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid #EEE7F5;background:#FBF9FE;
  border-radius:15px;padding:13px 15px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--teal);background:#F1FBFA;transform:translateY(-1px)}
.chip .n{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--purple)}
.chip .c{font-size:12px;color:var(--muted)}
.closex{float:right;border:none;background:#F4EEFA;color:var(--purple);width:34px;height:34px;border-radius:50%;
  font-size:18px;cursor:pointer;font-weight:700}

@media(max-width:860px){
  .stage{flex-direction:column;gap:16px;margin-top:8px}
  .phone{width:min(300px,72vw)}
  .panel{flex:none;width:min(460px,94vw)}
  .chapgrid{grid-template-columns:1fr}
  .wordmark{font-size:26px}
}
/* Phones: keep the demo phone and the Back/Next controls on screen together —
   smaller phone, and the controls moved directly beneath it. */
@media(max-width:720px){
  .stage{gap:12px}
  .phone{width:min(205px,54vw)}
  .card{min-height:0!important;padding:16px 18px 16px;display:flex;flex-direction:column}
  .controls{order:-2;margin-top:0}
  .progress{order:-1;margin-top:14px}
  .eyebrow{margin-top:16px;margin-bottom:10px}
  .title{font-size:19px;margin-bottom:8px}
  .body{font-size:14px;line-height:1.55}
  .subrow{margin-top:12px}
  .dotnav{margin-top:12px}
}
</style>
</head>

<script>
const DATA = {"images": {"home": "assets/img/tour/home.jpg", "home2": "assets/img/tour/home2.jpg", "config": "assets/img/tour/config.jpg", "access": "assets/img/tour/access.jpg", "downtime": "assets/img/tour/downtime.jpg", "limits": "assets/img/tour/limits.jpg", "loc": "assets/img/tour/loc.jpg", "loc2": "assets/img/tour/loc2.jpg", "filter": "assets/img/tour/filter.jpg", "other": "assets/img/tour/other.jpg", "account": "assets/img/tour/account.jpg"}, "steps": [{"scene": "cover", "chapter": "Welcome", "title": "An interactive tour of Tethar", "body": "A calm, hands-on look at how Tethar keeps a child’s phone safe. Step through at your own pace with <b>Next</b>, or use <b>Jump to feature</b> to go straight to what you’d like to show.", "hl": null}, {"scene": "home", "chapter": "Home dashboard", "title": "Your child, at a glance", "body": "Open Tethar and your child is right there: photo, battery and signal, beside how their week online is going. Connection first, no digging.", "hl": [6, 12.5, 29, 15.2]}, {"scene": "home", "chapter": "Home dashboard", "title": "One app, every child", "body": "Looking after more than one? Add each child here and move between their dashboards with a single tap.", "hl": [34.3, 12.3, 20.6, 15.7]}, {"scene": "home", "chapter": "Home dashboard", "title": "App Usage Breakdown", "body": "A calm, colour-coded picture of which apps filled the last seven days, and for how long, set against a daily screen-time goal you choose.", "hl": [6, 33, 89.1, 58.9]}, {"scene": "home", "chapter": "Home dashboard", "title": "Three simple areas", "body": "Everything lives under three tabs: <b>Home</b> for the daily picture, <b>Configuration</b> for setup, and <b>Reports</b> to see internet usage, locations and call/SMS history if you want to.", "hl": [5, 91.5, 90, 7.4]}, {"scene": "home2", "chapter": "Home dashboard", "title": "Know where they are", "body": "Their location on a map, with the address and how recently it refreshed. Peace of mind, without hovering.", "hl": [3, 43.5, 93.2, 29.3]}, {"scene": "home2", "chapter": "Home dashboard", "title": "Reward earned freedom", "body": "Grant a little extra phone time on the spot when it’s been earned. Freedom that flexes with trust.", "hl": [4.9, 73.8, 89.5, 6.2]}, {"scene": "home2", "chapter": "Home dashboard", "title": "Never lose a phone again", "body": "Phone gone missing down the back of the sofa? Make it ring, even on silent, and find it in seconds.", "hl": [4.5, 82.1, 90.6, 6.4]}, {"scene": "config", "chapter": "Configuration", "title": "One easy place to tailor settings to your child", "body": "Open any card to set it just so: app access, screen downtime, individual app time limits, internet filtering and location alerts.", "hl": [4.2, 39.6, 90.8, 51.9]}, {"scene": "access", "chapter": "App access", "title": "Approve which apps are usable", "body": "Decide which apps your child can use. A green tick means yes; untick to tuck it away.", "hl": [4.9, 24.7, 90.2, 66.3]}, {"scene": "access", "chapter": "App access", "title": "Allow access to the Play Store? It’s your decision", "body": "Otherwise, new downloads stay off until you say otherwise. Nothing new lands on the phone without your yes.", "hl": [82.9, 19.3, 11.4, 3]}, {"scene": "downtime", "chapter": "Downtime", "title": "Allow specific windows of phone use on any day of the week", "body": "Set the phone’s quiet hours for each day: school, dinner, bedtime. Tethar eases things down calmly; no snatching it away, no drama.", "hl": [4.3, 18.9, 91.4, 20.7]}, {"scene": "limits", "chapter": "Time limits", "title": "Set specific time limits per app", "body": "Hand any app its own daily allowance, say fifteen minutes of Minecraft per day, or only at the weekend, and set it differently for each day of the week.", "hl": [2.1, 12.3, 95.9, 77.9]}, {"scene": "loc", "chapter": "Favourite places", "title": "Arrive-and-leave alerts", "body": "Want to know when your child has arrived or departed school? Set alerts easily.", "hl": [4.2, 25.6, 92, 19.2]}, {"scene": "loc2", "chapter": "Favourite places", "title": "Adding a place is effortless", "body": "Search an address, drop the pin, name it, and choose your alerts. Done in seconds.", "hl": [2.5, 33, 94.2, 29]}, {"scene": "filter", "chapter": "Internet filtering", "title": "Safe internet searching", "body": "With the Tethar browser, you can lock the internet down to just the sites you’re comfortable with your child viewing. All internet search history and locations visited are also recorded, and can be viewed in Reports.", "hl": [4.5, 37.8, 92, 42.5]}, {"scene": "other", "chapter": "Calls & contacts", "title": "Always on ability to contact parents/guardians", "body": "Add trusted contacts that your child can always call or SMS, even during downtime.", "hl": [2.4, 12, 94.1, 26.3]}, {"scene": "other", "chapter": "Calls & contacts", "title": "Who can get through", "body": "Choose whether your child can call and text anyone, or only people already in their contacts, and whether they can add new ones themselves.", "hl": [3.2, 48.2, 93.6, 15.2]}, {"scene": "other", "chapter": "Calls & contacts", "title": "Allow photos and media to be shared/received", "body": "Avoid the headache of inappropriate photos or videos being shared or received.", "hl": [2.5, 79.1, 94.6, 11.5]}, {"scene": "account", "chapter": "Account & circle", "title": "Share the care", "body": "The <b>Parent / Guardian Circle</b> lets other trusted adults in to help view and configure the app.", "hl": [4, 53.2, 90.9, 6.7]}, {"scene": "end", "chapter": "Wrap up", "title": "That’s Tethar", "body": "Premium parental control that keeps your child safe without you having to worry.", "hl": null}], "logo": "assets/img/tour/logo.png"};

      stepLabel=document.getElementById('stepLabel'), totLabel=document.getElementById('totLabel'),
      barfill=document.getElementById('barfill'), prevBtn=document.getElementById('prev'),
      nextBtn=document.getElementById('next'), dotnav=document.getElementById('dotnav');

const coverHTML = `<img class="coverlogo" src="${DATA.logo}" alt="Tethar, Connected safely">`;
const endHTML = `<div class="lockup"><span class="w">tethar</span><span class="d"><i></i><i></i><i></i></span></div>
  <div class="line"></div>
  <div class="big">That’s Tethar</div>
  <div class="sub">Protection without policing. Calm by default, honest always.</div>
  <div class="kick" style="margin-top:22px">Connected safely.</div>`;

function render(){
  const s = steps[i];
  // scene
  if(s.scene==='cover' || s.scene==='end'){
    shot.style.display='none'; spot.style.display='none';
    fill.className = 'scene-fill cover-light';
    fill.style.display='flex'; fill.innerHTML = coverHTML;
  } else {
    fill.style.display='none';
    shot.style.display='block';
    if(shot.getAttribute('src') !== images[s.scene]){ shot.style.opacity=0;
      shot.src = images[s.scene]; requestAnimationFrame(()=>{shot.style.transition='opacity .4s';shot.style.opacity=1;}); }
    if(s.hl){ spot.style.display='block';
      spot.style.left=s.hl[0]+'%'; spot.style.top=s.hl[1]+'%';
      spot.style.width=s.hl[2]+'%'; spot.style.height=s.hl[3]+'%';
    } else { spot.style.display='none'; }
  }
  chapterEl.textContent = s.chapter;
  titleEl.textContent = s.title;
  bodyEl.innerHTML = s.body;
  stepLabel.textContent = (i===0?'Welcome':(i===steps.length-1?'Wrap up':'Feature '+i));
  totLabel.textContent = ((i===0||i===steps.length-1)?'':(i+' / '+(steps.length-2)));
  barfill.style.width = (i/(steps.length-1)*100)+'%';
  prevBtn.disabled = (i===0);
  nextBtn.textContent = (i===0?'Start tour →':(i===steps.length-1?'↺ Restart':'Next →'));
  // dots
  [...dotnav.children].forEach((d,idx)=>d.classList.toggle('on',idx===i));
}
function go(n){ i=Math.max(0,Math.min(steps.length-1,n)); render(); }
function next(){ if(i===steps.length-1){ go(0); } else { go(i+1); } }
function prev(){ go(i-1); }

nextBtn.onclick=next; prevBtn.onclick=prev;
document.getElementById('tapnext').onclick=next;
document.getElementById('restart').onclick=()=>go(0);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight')next(); if(e.key==='ArrowLeft')prev(); });

// dots
steps.forEach((s,idx)=>{ const d=document.createElement('i'); d.title=s.title;
  d.onclick=()=>go(idx); dotnav.appendChild(d); });

// jump modal
const modal=document.getElementById('modal'), grid=document.getElementById('chapgrid');
const chapters=[]; steps.forEach((s,idx)=>{ if(!chapters.find(c=>c.name===s.chapter)) chapters.push({name:s.chapter,idx:idx}); });
chapters.forEach(c=>{ const b=document.createElement('button'); b.className='chip';
  const first=steps[c.idx];
  b.innerHTML='<span class="n">'+c.name+'</span><span class="c">'+first.title+'</span>';
  b.onclick=()=>{ go(c.idx); modal.classList.remove('open'); }; grid.appendChild(b); });
document.getElementById('jumpBtn').onclick=()=>modal.classList.add('open');
document.getElementById('closex').onclick=()=>modal.classList.remove('open');
modal.onclick=e=>{ if(e.target===modal) modal.classList.remove('open'); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') modal.classList.remove('open'); });

render();
</script>

<!-- Reserve the card's tallest step up front so Back/Next sit in the same spot on every
     step. Measured off-screen at the current width, so it also holds when text rewraps. -->
<script>
(function(){
  var card = document.querySelector('.card');
  function fit(){
    var w = card.getBoundingClientRect().width;
    if (!w) return;
    var clone = card.cloneNode(true);
    clone.removeAttribute('id');
    clone.querySelectorAll('[id]').forEach(function(n){ n.removeAttribute('id'); });
    clone.style.cssText += ';position:absolute;left:-9999px;top:0;visibility:hidden;pointer-events:none;width:' + w + 'px';
    clone.style.setProperty('--card-min', '0px');
    card.parentNode.appendChild(clone);
    var t = clone.querySelector('.title'), b = clone.querySelector('.body'), max = 0;
    steps.forEach(function(s){
      t.textContent = s.title;
      b.innerHTML = s.body;
      max = Math.max(max, clone.getBoundingClientRect().height);
    });
    clone.remove();
    card.style.setProperty('--card-min', Math.ceil(max) + 'px');
  }
  window.addEventListener('load', fit);
  window.addEventListener('resize', fit);
  // Must re-measure once the webfonts land, otherwise the reserved height is based on
  // fallback-font metrics and comes out wrong.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  fit();
})();
</script>

<!-- Screens load from files rather than being inlined, so warm them in the background
     to keep stepping through the tour instant. -->
<script>
(function(){
  var q = Object.keys(images).map(function(k){ return images[k]; });
  (function warm(){
    var src = q.shift();
    if (!src) return;
    var im = new Image();
    im.onload = im.onerror = warm;   // one at a time, never competing with the visible screen
    im.src = src;
  })();
})();
</script>

<!-- Embedded mode: when inside an iframe, drop the full-viewport sizing and tell the
     parent page how tall we actually are, so the iframe never scrolls internally. -->
<script>
(function(){
  if (window.parent === window) return;
  var wrap = document.querySelector('.wrap');
  wrap.style.minHeight = '0';
  function post(){
    window.parent.postMessage({ tetharTourHeight: Math.ceil(wrap.getBoundingClientRect().height) }, '*');
  }
  window.addEventListener('load', post);
  window.addEventListener('resize', post);
  if (window.ResizeObserver) new ResizeObserver(post).observe(wrap);
  post();
})();
</script>
<!-- ===== Highlight editor (only active with ?edit=1 — never runs for normal visitors) ===== -->
<script>
(function(){
  var on = /[?&]edit(=1)?\b/.test(location.search) || location.hash === '#edit';
  if (!on) return;

  var screenEl = document.getElementById('screen');
  var spotEl   = document.getElementById('spot');
  var tapEl    = document.getElementById('tapnext');

  // edit-only styles
  var css = document.createElement('style');
  css.textContent =
    '.tour-edit #spot{transition:none!important;animation:none!important;cursor:move;pointer-events:auto!important;outline:2px dashed rgba(255,255,255,.9);outline-offset:-2px}'+
    '.tour-edit #tapnext{pointer-events:none!important}'+
    '.edit-handle{position:absolute;right:2px;bottom:2px;width:22px;height:22px;border-radius:7px;background:#fff;border:2px solid #1FB6B6;cursor:nwse-resize;box-shadow:0 2px 8px rgba(0,0,0,.35);touch-action:none}'+
    '.edit-handle::before{content:"";position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-right:2px solid #1FB6B6;border-bottom:2px solid #1FB6B6}'+
    '.edit-panel{position:fixed;top:16px;left:16px;z-index:9999;width:270px;background:#fff;border:1px solid #E8DFF3;border-radius:16px;box-shadow:0 18px 50px -18px rgba(42,18,64,.4);padding:16px;font-family:Nunito,system-ui,sans-serif;color:#241531}'+
    '.edit-panel .ep-title{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:15px;color:#6A1B87;margin-bottom:8px}'+
    '.edit-panel .ep-slide{font-size:12.5px;font-weight:700;color:#15807F;margin-bottom:6px;line-height:1.3}'+
    '.edit-panel .ep-vals{font-family:ui-monospace,Consolas,monospace;font-size:14px;background:#F7F4FB;border:1px solid #EEE7F5;border-radius:9px;padding:8px 10px;text-align:center;margin-bottom:10px}'+
    '.edit-panel .ep-row{display:flex;gap:8px}'+
    '.edit-panel button{flex:1;font-family:"Baloo 2",system-ui,sans-serif;font-weight:700;font-size:12.5px;padding:9px 8px;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,#1FB6B6,#6A1B87);color:#fff}'+
    '.edit-panel .ep-reset{width:100%;margin-top:8px;background:#F4EEFA;color:#6A1B87}'+
    '.edit-panel .ep-hint{margin-top:10px;font-size:11px;line-height:1.4;color:#6E6088}';
  document.head.appendChild(css);
  document.body.classList.add('tour-edit');

  // remember originals so "reset" works, and load any saved session overrides
  var originals = steps.map(function(s){ return s.hl ? s.hl.slice() : null; });
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem('tetharTourHL') || '{}'); } catch(e){}
  Object.keys(saved).forEach(function(k){ if (steps[k] && Array.isArray(saved[k])) steps[k].hl = saved[k].slice(); });

  // resize handle inside the box
  var handle = document.createElement('div');
  handle.className = 'edit-handle';
  spotEl.appendChild(handle);

  // control panel
  var panel = document.createElement('div');
  panel.className = 'edit-panel';
  panel.innerHTML =
    '<div class="ep-title">Highlight editor</div>'+
    '<div class="ep-slide" id="epSlide"></div>'+
    '<div class="ep-vals" id="epVals"></div>'+
    '<div class="ep-row"><button id="epOne">Copy this slide</button><button id="epAll">Copy all</button></div>'+
    '<button class="ep-reset" id="epReset">Reset all to original</button>'+
    '<div class="ep-hint">Drag the box to move it, pull the corner to resize. This is a preview — send me “Copy all” and I’ll make it live.</div>';
  document.body.appendChild(panel);

  var r1 = function(n){ return Math.round(n*10)/10; };
  function toPct(cx, cy){ var r = screenEl.getBoundingClientRect(); return { x:(cx-r.left)/r.width*100, y:(cy-r.top)/r.height*100 }; }
  function applySpot(){ var hl = steps[i].hl; if(!hl) return; spotEl.style.left=hl[0]+'%'; spotEl.style.top=hl[1]+'%'; spotEl.style.width=hl[2]+'%'; spotEl.style.height=hl[3]+'%'; }
  function persist(){ if(steps[i].hl){ saved[i]=steps[i].hl.slice(); try{ localStorage.setItem('tetharTourHL', JSON.stringify(saved)); }catch(e){} } }
  function updatePanel(){
    var s = steps[i];
    document.getElementById('epSlide').textContent = (i===0?'Welcome':(i===steps.length-1?'Wrap up':'Slide '+i)) + ' — ' + s.title;
    document.getElementById('epVals').textContent = s.hl ? '[ '+s.hl.map(r1).join(',  ')+' ]' : '(no highlight on this slide)';
  }

  var mode=null, start=null;
  function begin(e, m){ if(!steps[i].hl) return; mode=m; var p=toPct(e.clientX,e.clientY); start={px:p.x,py:p.y,hl:steps[i].hl.slice()}; e.preventDefault(); e.stopPropagation(); }
  spotEl.addEventListener('pointerdown', function(e){ if(e.target===handle) return; begin(e,'move'); });
  handle.addEventListener('pointerdown', function(e){ begin(e,'resize'); });
  window.addEventListener('pointermove', function(e){
    if(!mode) return;
    var p=toPct(e.clientX,e.clientY), hl=steps[i].hl;
    if(mode==='move'){
      hl[0]=r1(Math.max(0, Math.min(100-hl[2], start.hl[0]+(p.x-start.px))));
      hl[1]=r1(Math.max(0, Math.min(100-hl[3], start.hl[1]+(p.y-start.py))));
    } else {
      hl[2]=r1(Math.max(4, Math.min(100-hl[0], start.hl[2]+(p.x-start.px))));
      hl[3]=r1(Math.max(3, Math.min(100-hl[1], start.hl[3]+(p.y-start.py))));
    }
    applySpot(); updatePanel();
  });
  window.addEventListener('pointerup', function(){ if(mode){ persist(); mode=null; } });

  function copy(t, btn){ if(navigator.clipboard) navigator.clipboard.writeText(t); var o=btn.textContent; btn.textContent='Copied!'; setTimeout(function(){ btn.textContent=o; },1200); }
  document.getElementById('epOne').onclick=function(){ copy('Slide '+i+': ['+steps[i].hl.map(r1).join(', ')+']', this); };
  document.getElementById('epAll').onclick=function(){
    var lines=steps.map(function(s,idx){ return s.hl? 'Slide '+idx+': ['+s.hl.map(r1).join(', ')+']' : null; }).filter(Boolean);
    copy(lines.join('\n'), this);
  };
  document.getElementById('epReset').onclick=function(){ localStorage.removeItem('tetharTourHL'); location.reload(); };

  // keep the panel & box in sync when the slide changes (via any nav control)
  var lastI=-1;
  setInterval(function(){ if(i!==lastI){ lastI=i; if(steps[i]&&steps[i].hl) applySpot(); updatePanel(); } }, 120);
  updatePanel();
})();
</script>
</body>
